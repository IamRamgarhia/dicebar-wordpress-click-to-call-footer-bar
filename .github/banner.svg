<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Mobile Bottom Bar for WordPress: a phone showing a sticky bar with call, chat, directions and share buttons">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#6f9ceb"/>
			<stop offset="38%" stop-color="#a5c4f2"/>
			<stop offset="70%" stop-color="#f2c9a8"/>
			<stop offset="100%" stop-color="#e8927c"/>
		</linearGradient>
		<linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#f7f8fa"/>
			<stop offset="100%" stop-color="#ffffff"/>
		</linearGradient>
	</defs>

	<rect width="720" height="260" fill="url(#page)"/>

	<g transform="translate(44 34)">
		<text x="0" y="24" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="27" font-weight="700" fill="#16181d">Mobile Bottom Bar</text>
		<text x="0" y="56" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" fill="#43474f">Click to call, chat, directions and social buttons,</text>
		<text x="0" y="78" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" fill="#43474f">pinned under the thumb on every page.</text>

		<g font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#2563eb">
			<rect x="0" y="102" width="104" height="26" rx="13" fill="#eff5ff"/>
			<text x="16" y="119">Any theme</text>
			<rect x="112" y="102" width="112" height="26" rx="13" fill="#eff5ff"/>
			<text x="128" y="119">No tracking</text>
			<rect x="232" y="102" width="76" height="26" rx="13" fill="#eff5ff"/>
			<text x="248" y="119">Free</text>
		</g>
	</g>

	<g transform="translate(452 26)">
		<rect x="0" y="0" width="212" height="208" rx="26" fill="#16181d"/>
		<rect x="8" y="8" width="196" height="192" rx="19" fill="url(#sky)"/>

		<g fill="#ffffff" opacity="0.55">
			<rect x="26" y="30" width="120" height="11" rx="5"/>
			<rect x="26" y="50" width="156" height="8" rx="4"/>
			<rect x="26" y="66" width="142" height="8" rx="4"/>
			<rect x="26" y="82" width="150" height="8" rx="4"/>
		</g>

		<g transform="translate(20 132)">
			<rect x="0" y="0" width="172" height="52" rx="16" fill="#ffffff" opacity="0.78"/>
			<g stroke="#1c1c1e" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
				<path d="M25 16.9v2a1.3 1.3 0 0 1-1.5 1.3 13 13 0 0 1-5.7-2 12.8 12.8 0 0 1-4-4 13 13 0 0 1-2-5.7A1.3 1.3 0 0 1 13.1 7h2a1.3 1.3 0 0 1 1.3 1.1c.1.6.2 1.2.5 1.8a1.3 1.3 0 0 1-.3 1.4l-.9.8a10.5 10.5 0 0 0 4 4l.8-.8a1.3 1.3 0 0 1 1.4-.3c.6.2 1.2.4 1.8.5A1.3 1.3 0 0 1 25 16.9Z" transform="translate(6 2)"/>
				<path d="M75 13.5a5.5 5.5 0 0 1-5.9 5.5 5.6 5.6 0 0 1-2.6-.6l-3.4 1 1-3.4a5.6 5.6 0 0 1-.6-2.6 5.5 5.5 0 0 1 5.5-5.9 5.5 5.5 0 0 1 5.9 5.9Z" transform="translate(-1 2)"/>
				<path d="M124 12.4c0 3.9-5.2 7.8-5.2 7.8s-5.2-3.9-5.2-7.8a5.2 5.2 0 0 1 10.4 0Z" transform="translate(-1 2)"/>
				<circle cx="118.6" cy="12.4" r="1.9" transform="translate(-1 2)"/>
				<circle cx="160" cy="10" r="2" transform="translate(-1 2)"/>
				<circle cx="152" cy="14.5" r="2" transform="translate(-1 2)"/>
				<circle cx="160" cy="19" r="2" transform="translate(-1 2)"/>
				<path d="m153.7 15.6 4.6 2.7M158.3 11.2l-4.6 2.7" transform="translate(-1 2)"/>
			</g>
			<g font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="6.5" font-weight="700" fill="#1c1c1e" letter-spacing="0.7" text-anchor="middle">
				<text x="21" y="40">CALL</text>
				<text x="64" y="40">CHAT</text>
				<text x="107" y="40">FIND US</text>
				<text x="150" y="40">SHARE</text>
			</g>
		</g>
