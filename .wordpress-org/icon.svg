<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#1e3a8a"/>
			<stop offset="52%" stop-color="#2563eb"/>
			<stop offset="100%" stop-color="#4f46e5"/>
		</linearGradient>
		<radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0%" stop-color="#ff8a5c" stop-opacity="0.62"/>
			<stop offset="100%" stop-color="#ff8a5c" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#ffffff" stop-opacity="0.97"/>
			<stop offset="100%" stop-color="#ffffff" stop-opacity="0.80"/>
		</linearGradient>
	</defs>

	<rect width="256" height="256" rx="58" fill="url(#tile)"/>
	<ellipse cx="196" cy="212" rx="130" ry="104" fill="url(#warm)"/>

	<!-- The phone, drawn as a hint rather than an outline, so it survives 128px. -->
	<rect x="66" y="34" width="124" height="188" rx="30" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.34" stroke-width="4"/>

	<g fill="#ffffff" opacity="0.34">
		<rect x="88" y="66" width="58" height="9" rx="4.5"/>
		<rect x="88" y="86" width="80" height="7" rx="3.5"/>
		<rect x="88" y="102" width="70" height="7" rx="3.5"/>
	</g>

	<!-- The bar itself is the mark. Frosted panel, lit top edge, four buttons. -->
	<g transform="translate(80 148)">
		<rect x="0" y="0" width="96" height="52" rx="18" fill="url(#dock)"/>
		<rect x="9" y="2" width="78" height="2.4" rx="1.2" fill="#ffffff" fill-opacity="0.9"/>
		<g fill="#1e3a8a">
			<circle cx="18" cy="26" r="6"/>
			<circle cx="38" cy="26" r="6"/>
			<circle cx="58" cy="26" r="6"/>
			<circle cx="78" cy="26" r="6" fill="#2563eb"/>
		</g>
	</g>
</svg>
